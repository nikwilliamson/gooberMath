<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0a1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://use.typekit.net" />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/sec4hvw.css" />
    <title>GooberMath</title>
    <meta
      name="description"
      content="A math-facts speed game. Beat the clock, chain combos, and unlock the next quest."
    />

    <!--
      Absolute URLs on purpose: every scraper (iMessage, Slack, Discord, X)
      resolves og:image against nothing, so a relative path silently yields no
      preview. Update the domain here if the site ever moves.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GooberMath" />
    <meta property="og:url" content="https://goobermath.com/" />
    <meta property="og:title" content="GooberMath" />
    <meta
      property="og:description"
      content="A math-facts speed game. Beat the clock, chain combos, and unlock the next quest."
    />
    <meta property="og:image" content="https://goobermath.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Goober running past the GooberMath logo." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GooberMath" />
    <meta
      name="twitter:description"
      content="A math-facts speed game. Beat the clock, chain combos, and unlock the next quest."
    />
    <meta name="twitter:image" content="https://goobermath.com/og.jpg" />

    <link rel="canonical" href="https://goobermath.com/" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /*
       * If nothing mounts, this source index.html is being served instead of the
       * built one — either from a browser cache left over from an earlier deploy,
       * or because Pages is serving the repo root. Either way /src/main.tsx below
       * resolves against the domain root and 404s. A blank page gives you nothing
       * to go on, so say it out loud.
       */
      setTimeout(function () {
        var root = document.getElementById('root')
        if (!root || root.childElementCount > 0) return
        root.innerHTML =
          '<div style="min-height:100dvh;display:grid;place-items:center;padding:28px;' +
          'background:#080a10;color:#f3f5fa;font:600 14px/1.6 ui-monospace,monospace;text-align:center">' +
          '<div><p style="color:#f5b21f;letter-spacing:.14em">GOOBERMATH DID NOT LOAD</p>' +
          '<p>A 404 for <b>main.tsx</b> means you are seeing this source page, not the built one.</p>' +
          '<p style="color:#8a93a8">Usually a stale browser cache: open it in a private tab, or clear ' +
          'website data for this site. If a private tab fails too, set repo Settings &rarr; Pages &rarr; ' +
          'Source to <b>GitHub Actions</b> and re-run the deploy.</p></div></div>'
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
